<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #F4EAE1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: 80px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      z-index: 2000;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    }
    .sidebar a {
      margin-bottom: 35px;
      color: rgb(255, 136, 0);
      font-size: 26px;
      text-decoration: none;
      transition: 0.3s;
    }
    .sidebar a:hover {
      transform: scale(1.2);
      color: #ffe0b2;
    }

    .container {
      margin-right: 80px;
      width: calc(100% - 100px);
      max-width: 800px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 2px solid #F4EAE1;
      padding-bottom: 30px;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid orange;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .profile-name {
      font-size: 24px;
      color: #4a0e4e;
      margin: 0 0 5px 0;
      font-weight: bold;
    }

    .profile-handle {
      font-size: 14px;
      color: #777;
      margin: 0 0 20px 0;
    }

    .follow-btn {
      background-color: rgb(255, 136, 0);
      color: white;
      border: none;
      padding: 10px 35px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 136, 0, 0.3);
      transition: 0.2s;
    }

    .follow-btn.subscribed {
      background-color: #555 !important;
      box-shadow: none;
    }

    .tabs-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      border-bottom: 1px solid #ddd;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #777;
      padding: 12px 20px;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 3px solid transparent;
      flex-grow: 1;
    }

    .tab-btn:hover {
      color: rgb(255, 136, 0);
    }

    .tab-btn.active {
      color: rgb(255, 136, 0);
      border-bottom-color: rgb(255, 136, 0);
    }

    .tab-content {
      margin-top: 25px;
      min-height: 200px;
    }

    .placeholder-tab-box {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .placeholder-tab-box i {
      font-size: 40px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .profile-posts-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mini-post-card {
      background: #fffbf7;
      border-right: 5px solid #FFD700;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .mini-post-text {
      color: #333;
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="inndex.html"><i class="fas fa-house"></i></a>
    <a href="profile2.html"><i class="fas fa-circle-user"></i></a>
    <a href="bell2.html"><i class="fas fa-bell"></i></a>
    <a href="app.html"><i class="fas fa-external-link-alt"></i></a>
  </div>

  <div class="container">
    <div class="profile-header">
      <img src="https://via.placeholder.com/150" class="profile-pic" id="pPic" alt="Avatar">
      <h2 class="profile-name" id="pName">اسم المستخدم</h2>
      <p class="profile-handle" id="pHandle">@username</p>
      
      <button class="follow-btn" id="followBtn" onclick="toggleFollow()">متابعة</button>
    </div>

    <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('videos', this)"><i class="fas fa-video"></i> فيديوهات</button>
      <button class="tab-btn" onclick="switchTab('shorts', this)"><i class="fas fa-bolt"></i> فيديوهات قصيرة</button>
      <button class="tab-btn" onclick="switchTab('posts', this)"><i class="fas fa-file-alt"></i> المنشورات</button>
    </div>

    <div class="tab-content" id="tabContent"></div>
  </div>

  <script>
    let currentUserAccount = "";

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('username') || "مستخدم مجهول";
      const accountName = params.get('account') || "@unknown";
      const pic = params.get('pic') || "https://via.placeholder.com/150";

      currentUserAccount = accountName;

      document.getElementById('pName').innerText = name;
      document.getElementById('pHandle').innerText = accountName;
      document.getElementById('pPic').src = pic;

      // تحديث زر المتابعة بناءً على حالة هذا الحساب المحددة في الـ LocalStorage
      updateFollowButtonState();

      switchTab('videos', document.querySelector('.tab-btn.active'));
    };

    // جلب قائمة الحسابات المتابَعة من المتصفح لمعرفة حالة هذا الحساب بالتحديد
    function getFollowedAccounts() {
      return JSON.parse(localStorage.getItem('followedAccounts')) || {};
    }

    function updateFollowButtonState() {
      const followedList = getFollowedAccounts();
      const btn = document.getElementById('followBtn');
      
      if (followedList[currentUserAccount] === true) {
        btn.innerText = "مشترك ✓";
        btn.classList.add('subscribed');
      } else {
        btn.innerText = "متابعة";
        btn.classList.remove('subscribed');
      }
    }

    function toggleFollow() {
      const followedList = getFollowedAccounts();
      
      // عكس حالة المتابعة لهذا الحساب فقط
      if (followedList[currentUserAccount] === true) {
        followedList[currentUserAccount] = false;
      } else {
        followedList[currentUserAccount] = true;
      }

      localStorage.setItem('followedAccounts', JSON.stringify(followedList));
      updateFollowButtonState();
    }

    function switchTab(tabName, element) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      const contentBox = document.getElementById('tabContent');

      if (tabName === 'videos') {
        contentBox.innerHTML = `
          <div class="placeholder-tab-box">
            <i class="fas fa-video"></i>
            <p>لا توجد فيديوهات منشورة حالياً لهذا الحساب.</p>
          </div>
        `;
      } else if (tabName === 'shorts') {
        contentBox.innerHTML = `
          <div class="placeholder-tab-box">
            <i class="fas fa-bolt"></i>
            <p>لا توجد فيديوهات قصيرة منشورة حالياً لهذا الحساب.</p>
          </div>
        `;
      } else if (tabName === 'posts') {
        // فلترة المنشورات لعرض المنشورات الخاصة بهذا المعرّف (Account) فقط دون المنشورات العامة الأخرى!
        const allPosts = JSON.parse(localStorage.getItem('myPosts')) || [];
        const userPosts = allPosts.filter(p => p.accountName === currentUserAccount);

        if (userPosts.length === 0) {
          contentBox.innerHTML = `
            <div class="placeholder-tab-box">
              <i class="fas fa-file-excel"></i>
              <p>لم يقم هذا الحساب بنشر أي منشورات بعد.</p>
            </div>
          `;
        } else {
          let postsHtml = '<div class="profile-posts-list">';
          userPosts.forEach(post => {
            postsHtml += `
              <div class="mini-post-card">
                <p class="mini-post-text">${post.text}</p>
              </div>
            `;
          });
          postsHtml += '</div>';
          contentBox.innerHTML = postsHtml;
        }
      }
    }
  </script>
</body>
</html>
