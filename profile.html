<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريط الجانبي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* التعديل الجديد: تغيير خلفية الصفحة بالكامل لتصبح مريحة للعين */
        body {
            background-color: #ffb700; /* رمادي داكن مريح جداً */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar { 
            position: fixed; 
            right: 0; 
            top: 0; 
            height: 100%; 
            width: 80px; 
            background: rgb(255, 255, 255); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px; 
            z-index: 2000;
            box-shadow: -2px 0 10px rgba(0,0,0,0.3); /* تم تزييد الظل ليناسب الخلفية المظلمة */
        }
        
        .sidebar a { 
            margin-bottom: 35px; 
            color: rgb(255, 149, 0); 
            font-size: 26px; 
            text-decoration: none; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar a:hover { 
            transform: scale(1.2); 
            color: #ff9900; 
        }

        .profile-icon {
            color: rgb(255, 166, 0) !important;
            background-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="index.html"><i class="fas fa-home"></i></a>
        <a href="profile.html">
            <i class="fas fa-user-circle profile-icon"></i>
        </a>
        <a href="bell.html"><i class="fas fa-bell"></i></a>
        <a href="create.html">
            <div class="create-icon-container">
                <i class="fas fa-external-link-alt"></i>
            </div>
        </a>
    </div>

</body>
</html>



<style>
    /* هذا الكود يتحكم فقط في الدائرة التي في منتصف الصفحة ويجبرها على السنتر المطلق */
    .absolute-center-profile {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* التوسيط الهندسي الدقيق */
        z-index: 9999;
        display: block;
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* تأثير تفاعلي ممتع عند تمرير الماوس */
    .absolute-center-profile:hover {
        transform: translate(-50%, -50%) scale(1.1); /* تكبير خفيف دون خسارة التوسيط */
        filter: drop-shadow(0 0 20px rgba(185, 122, 87, 0.5)); /* توهج بني ناعم */
    }
    
    /* عند الضغط الفعلي */
    .absolute-center-profile:active {
        transform: translate(-50%, -50%) scale(0.95);
    }
</style>
