<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #e1e1e1; border-radius: 12px; box-sizing: border-box; outline: none; }
        input:focus { border-color: orange; }
        #loginBtn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #loginBtn:hover { background: #2980b9; }
        #loginBtn:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; line-height: 1.5; font-weight: bold; }
        .waiting-msg { color: #e67e22; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; font-weight: bold; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #3498db; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل الدخول</h2>
    
    <div id="errorMsg" class="error-msg">البريد الإلكتروني أو مفتاح الدخول غير صحيح!</div>
    <div id="waitingMsg" class="waiting-msg"></div>

    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني (اسم المستخدم)" required>
    <input type="password" id="loginKey" placeholder="مفتاح الدخول Access Key" required>

    <button id="loginBtn" onclick="validateLogin()">تسجيل دخول</button>
    
    <a href="aaaa.html" class="back-link">إنشاء حساب جديد</a>
</div>

<script>
    const BLOCK_DURATION = 10 * 1000; 

    window.onload = function() {
        checkInitialBlock();
    };

    function checkInitialBlock() {
        const blockUntil = localStorage.getItem('loginBlockUntil');
        const now = new Date().getTime();
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        if (blockUntil && now < blockUntil) {
            loginBtn.disabled = true;
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'عذراً، تم رفض الدخول. يجدر الانتظار قليلاً قبل المحاولة مرة أخرى.';
            
            const remainingTime = blockUntil - now;
            setTimeout(() => {
                localStorage.removeItem('loginBlockUntil');
                loginBtn.disabled = false;
                errorMsg.style.display = 'none';
            }, remainingTime);
        }
    }

    function validateLogin() {
        const inputEmail = document.getElementById('loginEmail').value.trim();
        const inputKey = document.getElementById('loginKey').value;
        const errorMsg = document.getElementById('errorMsg');
        const waitingMsg = document.getElementById('waitingMsg');
        const loginBtn = document.getElementById('loginBtn');

        errorMsg.style.display = 'none';
        waitingMsg.style.display = 'none';

        const blockUntil = localStorage.getItem('loginBlockUntil');
        const now = new Date().getTime();

        if (blockUntil && now < blockUntil) {
            loginBtn.disabled = true;
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'عذراً، الحساب محظور مؤقتاً من محاولات الدخول السابقة.';
            return;
        }

        const storedDataJson = localStorage.getItem('userAccount');

        if (!storedDataJson) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'لا توجد أي حسابات مسجلة مسبقاً! يرجى إنشاء حساب أولاً.';
            return;
        }

        const storedData = JSON.parse(storedDataJson);

        if (inputEmail === storedData.user && inputKey === storedData.key) {
            if (storedData.mode === 3) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'عذراً، لا يمكنك تسجيل الدخول (تم منع الدخول لهذا الحساب).';
            } 
            else if (storedData.mode === 2) {
                waitingMsg.style.display = 'block';
                waitingMsg.textContent = 'جاري اخذ موافقة صاحب الحساب لدخولك...';
                loginBtn.disabled = true;
                
                localStorage.setItem('loginRequest', 'pending');
                monitorApproval();
            } 
            else if (storedData.mode === 1) {
                window.location.href = 'cccc.html';
            }
        } else {
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'البريد الإلكتروني أو مفتاح الدخول غير صحيح!';
        }
    }

    function monitorApproval() {
        const errorMsg = document.getElementById('errorMsg');
        const waitingMsg = document.getElementById('waitingMsg');
        const loginBtn = document.getElementById('loginBtn');

        const checkInterval = setInterval(() => {
            const status = localStorage.getItem('loginRequest');

            if (status === 'approved') {
                clearInterval(checkInterval);
                localStorage.removeItem('loginRequest');
                localStorage.removeItem('loginBlockUntil');
                window.location.href = 'cccc.html';
            } 
            else if (status === 'rejected') {
                clearInterval(checkInterval);
                localStorage.removeItem('loginRequest');
                
                const blockTime = new Date().getTime() + BLOCK_DURATION;
                localStorage.setItem('loginBlockUntil', blockTime);

                waitingMsg.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'عذراً، صاحب الحساب لم يقبل دخولك.';
                
                loginBtn.disabled = true;

                setTimeout(() => {
                    localStorage.removeItem('loginBlockUntil');
                    loginBtn.disabled = false;
                    errorMsg.style.display = 'none';
                }, BLOCK_DURATION);
            }
        }, 1000);
    }
</script>

</body>
</html>
