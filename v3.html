<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الفيديو - المنصة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #fff5f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* سهم الرجوع فوق يسار */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #ffffff;
            color: #d81b60;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.15);
            transition: all 0.3s ease;
            z-index: 100;
        }
        .back-btn:hover { background-color: #d81b60; color: #ffffff; }

        .main-container {
            display: flex;
            flex: 1;
            padding: 30px;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* جهة اليمين: عرض الفيديو الرئيسي */
        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.08);
        }

        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info-title {
            margin-top: 15px;
            font-size: 20px;
            color: #880e4f;
            font-weight: bold;
        }

        /* تفاعل القلب والتعليق الحقيقي */
        .video-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #fce4ec;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            transition: color 0.2s;
        }

        .action-btn.like-btn i { color: #ccc; transition: 0.2s; }
        .action-btn.like-btn.active i { color: #e91e63; transform: scale(1.2); }
        .action-btn:hover { color: #d81b60; }

        /* شريط التعليقات الحقيقية */
        .comments-section {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comments-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .comment-item {
            background: #fff0f3;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .comment-user {
            font-weight: bold;
            color: #c2185b;
            margin-bottom: 3px;
        }

        .comment-input-box {
            display: flex;
            gap: 10px;
        }

        .comment-input-box input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #f8bbd0;
            border-radius: 25px;
            outline: none;
            background: #fffdfd;
        }
        .comment-input-box input:focus { border-color: #d81b60; }

        .comment-input-box button {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .comment-input-box button:hover { background-color: #ad1457; }

        /* جهة اليسار: فيديوهات الناشر المسحوبة بالترتيب */
        .publisher-sidebar {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.08);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #880e4f;
            margin-bottom: 5px;
        }

        .playlist-item {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .playlist-item:hover { background: #fff0f3; }

        .playlist-thumb {
            width: 120px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
        }

        .playlist-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .playlist-video-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .playlist-channel { font-size: 12px; color: #777; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; padding: 15px; padding-top: 60px; }
            .publisher-sidebar { max-height: none; }
        }
    </style>
</head>
<body>

    <!-- سهم الرجوع فوق يسار -->
    <button class="back-btn" onclick="history.back()" title="رجوع">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="main-container">
        <!-- جهة اليمين: الفيديو والتعليقات الحقيقية -->
        <div class="video-section">
            <div class="video-container">
                <video id="mainVideo" controls autoplay>
                    <source id="videoSource" src="" type="video/mp4">
                    متصفحك لا يدعم عرض الفيديو.
                </video>
            </div>
            
            <h2 class="video-info-title" id="videoTitleDisplay">عنوان الفيديو</h2>

            <!-- تفاعل القلب الحقيقي -->
            <div class="video-actions">
                <button class="action-btn like-btn" id="likeBtn" onclick="toggleLike()">
                    <i class="fas fa-heart"></i> <span id="likeCount">0</span>
                </button>
                <button class="action-btn">
                    <i class="fas fa-comment"></i> التعليقات الحقيقية
                </button>
            </div>

            <!-- قسم التعليقات -->
            <div class="comments-section" id="commentsSection">
                <div class="comments-list" id="commentsList">
                    <!-- ستظهر التعليقات الحقيقية هنا فقط -->
                </div>

                <div class="comment-input-box" id="commentBoxContainer">
                    <input type="text" id="commentInput" placeholder="اكتب تعليقاً حقيقياً...">
                    <button onclick="addComment()">تعليق</button>
                </div>
            </div>
        </div>

        <!-- جهة اليسار: فيديوهات الناشر المسحوبة من profile2 بالترتيب -->
        <div class="publisher-sidebar" id="publisherSidebar">
            <div class="sidebar-title">فيديوهات الناشر</div>
        </div>
    </div>

    <script>
        let userData = JSON.parse(localStorage.getItem('userAccount')) || { user: "my_account" };
        let currentUser = "@" + userData.user;
        let currentVideoId = null;

        window.onload = function() {
            loadVideoAndPlaylist();
        }

        function loadVideoAndPlaylist() {
            const urlParams = new URLSearchParams(window.location.search);
            currentVideoId = urlParams.get('id');

            let allVideos = JSON.parse(localStorage.getItem('my_global_videos') || '[]');
            if (allVideos.length === 0) return;

            let currentVideo = allVideos.find(v => v.id == currentVideoId) || allVideos[0];
            currentVideoId = currentVideo.id; // ضمان وجود الـ ID

            // عرض الفيديو الرئيسي
            document.getElementById('videoSource').src = currentVideo.url;
            document.getElementById('mainVideo').load();
            document.getElementById('videoTitleDisplay').innerText = currentVideo.title || "بدون عنوان";

            // تحميل بيانات الإعجابات والتعليقات الحقيقية الخاصة بهذا الفيديو فقط
            loadRealInteractions(currentVideoId);

            // تعبئة قائمة اليسار بالفيديوهات المرتبة
            const sidebar = document.getElementById('publisherSidebar');
            sidebar.innerHTML = '<div class="sidebar-title">فيديوهات الناشر</div>';

            allVideos.forEach(video => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.onclick = () => {
                    window.location.href = `v3.html?id=${video.id}`;
                };

                item.innerHTML = `
                    <video class="playlist-thumb" src="${video.url}#t=0.1" muted preload="metadata"></video>
                    <div class="playlist-info">
                        <div class="playlist-video-title">${escapeHtml(video.title)}</div>
                        <div class="playlist-channel">${currentUser}</div>
                    </div>
                `;
                sidebar.appendChild(item);
            });
        }

        // تحميل القلوب والتعليقات الحقيقية من التخزين المحلي
        function loadRealInteractions(videoId) {
            let videoData = JSON.parse(localStorage.getItem('video_interactions_' + videoId)) || { likes: 0, likedByMe: false, comments: [] };
            
            // عداد القلوب
            document.getElementById('likeCount').innerText = videoData.likes;
            const likeBtn = document.getElementById('likeBtn');
            if (videoData.likedByMe) {
                likeBtn.classList.add('active');
            } else {
                likeBtn.classList.remove('active');
            }

            // قائمة التعليقات
            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML = '';
            
            if(videoData.comments.length === 0) {
                commentsList.innerHTML = '<p style="color: #888; font-size: 13px; text-align: center; padding: 10px;">لا توجد تعليقات بعد.</p>';
            } else {
                videoData.comments.forEach(c => {
                    const commentItem = document.createElement('div');
                    commentItem.classList.add('comment-item');
                    commentItem.innerHTML = `
                        <div class="comment-user">${escapeHtml(c.user)}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    `;
                    commentsList.appendChild(commentItem);
                });
            }
        }

        // تسجيل قلب حقيقي عند الضغط
        function toggleLike() {
            if (!currentVideoId) return;
            let storageKey = 'video_interactions_' + currentVideoId;
            let videoData = JSON.parse(localStorage.getItem(storageKey)) || { likes: 0, likedByMe: false, comments: [] };

            if (videoData.likedByMe) {
                videoData.likes -= 1;
                videoData.likedByMe = false;
            } else {
                videoData.likes += 1;
                videoData.likedByMe = true;
            }

            localStorage.setItem(storageKey, JSON.stringify(videoData));
            loadRealInteractions(currentVideoId);
        }

        // إضافة تعليق حقيقي مسجل
        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text === "" || !currentVideoId) return;

            let storageKey = 'video_interactions_' + currentVideoId;
            let videoData = JSON.parse(localStorage.getItem(storageKey)) || { likes: 0, likedByMe: false, comments: [] };

            videoData.comments.unshift({
                user: currentUser,
                text: text
            });

            localStorage.setItem(storageKey, JSON.stringify(videoData));
            input.value = "";
            loadRealInteractions(currentVideoId);
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
