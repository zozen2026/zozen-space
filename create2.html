<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء - Orange Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Firebase SDKs (خوادم جوجل الخارجية للتخزين والتحليلات) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #ffb700;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar { 
            position: fixed; 
            right: 0; 
            top: 0; 
            height: 100%; 
            width: 80px; 
            background: rgb(255, 255, 255); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px; 
            z-index: 2000;
            box-shadow: -2px 0 10px rgba(0,0,0,0.3);
        }
        
        .sidebar a { 
            margin-bottom: 35px; 
            color: rgb(255, 149, 0); 
            font-size: 26px; 
            text-decoration: none; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar a:hover { transform: scale(1.2); color: #ff9900; }

        .profile-icon {
            color: rgb(255, 166, 0) !important;
            background-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-sidebar {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            max-width: 400px;
            margin-right: 140px;
            margin-top: 140px;
            direction: rtl;
            font-family: sans-serif;
        }

        .search-container { position: relative; width: 100%; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        .search-input { width: 100%; padding: 10px 40px 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }

        .main-btn { cursor: pointer; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; transition: 0.3s; }
        .main-btn span { font-size: 20px; font-weight: bold; }

        .geo-camera { width: 40px; height: 25px; background: black; border-radius: 4px; position: relative; }
        .geo-camera-lens { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; position: absolute; top: 4px; left: 12px; }

        .divider { border: 0.5px solid #eee; margin: 20px 0; width: 100%; }

        .post-icon-shape { width: 35px; height: 35px; background: orange; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }

        .publish-studio-container { text-align: right; margin-top: 2cm; margin-right: 3.7cm; position: relative; z-index: 500; }
        .publish-studio-btn { display: inline-flex; align-items: center; gap: 12px; background: transparent; border: none; padding: 10px; cursor: pointer; }
        .publish-studio-icon-wrapper { position: relative; width: 32px; height: 32px; background-color: #e8f5e9; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .publish-studio-text { font-size: 16px; font-weight: bold; color: #333333; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 3000; direction: rtl; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; text-align: center; position: relative; width: 420px; max-width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-close-btn { position: absolute; top: 10px; left: 10px; background: transparent; border: none; font-size: 20px; font-weight: bold; color: #666; cursor: pointer; }
        .modal-text { margin-top: 15px; font-size: 16px; font-weight: bold; color: #333; }

        .permission-buttons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn-yes { background: #4CAF50; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-no { background: #f44336; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .studio-container { display: none; margin-top: 15px; }
        .file-select-btn { background: #e8f5e9; color: #2e7d32; border: 2px dashed #4CAF50; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 8px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
        .video-thumb-card { background: #fff; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 5px; transition: 0.2s; }
        .video-thumb-card.selected { border-color: #4CAF50; background-color: #e8f5e9; }
        .video-thumb-card video { width: 100%; height: 50px; object-fit: cover; border-radius: 4px; background: #000; }
        .video-thumb-card span { font-size: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

        .modal-ok-container { margin-top: 10px; }
        .ok-btn { background: #cccccc; color: #fff; border: none; padding: 10px 25px; border-radius: 6px; cursor: not-allowed; font-weight: bold; width: 100%; }

        .publish-preview-step { display: none; margin-top: 15px; text-align: right; }
        .preview-video-element { width: 100%; max-height: 200px; border-radius: 8px; background: #000; margin-bottom: 12px; }
        .video-title-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; font-family: inherit; }
        .video-title-input:focus { border-color: #4CAF50; }
        .final-publish-btn { background: #4CAF50; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }

        .progress-bar-container { display: none; width: 100%; background-color: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 12px; height: 20px; position: relative; }
        .progress-bar-fill { height: 100%; background-color: #4CAF50; width: 0%; transition: width 0.2s; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="inndex.html"><i class="fas fa-home"></i></a>
        <a href="profile2.html"><i class="fas fa-user-circle profile-icon"></i></a>
        <a href="bell2.html"><i class="fas fa-bell"></i></a>
        <a href="create2.html"><div class="create-icon-container"><i class="fas fa-external-link-alt"></i></div></a>
    </div>

    <div class="right-sidebar">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search anything" class="search-input">
        </div>

        <div class="main-btn" onclick="window.location.href='llll.html'">
            <div class="geo-camera"><div class="geo-camera-lens"></div></div>
            <span>انشئ فيديو</span>
        </div>

        <div class="divider"></div>

        <div class="main-btn" onclick="window.location.href='app.html'">
            <div class="post-icon-shape"></div>
            <span>منشور</span>
        </div>

        <div class="main-btn" onclick="window.location.href='PPPP.html'">
            <svg width="26" height="38" viewBox="0 0 24 36" fill="none" style="margin-right: 5px;">
                <rect width="24" height="36" fill="#2c3e50"/>
                <path d="M10 14.5V21.5L15.5 18L10 14.5Z" fill="white"/>
            </svg>
            <span>نشر فيديو قصير</span>
        </div>
    </div>

    <div class="publish-studio-container">
        <button type="button" onclick="showWarningModal()" class="publish-studio-btn">
            <div class="publish-studio-icon-wrapper">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C10.5 15 9 13 9 13L3 21h18L14 6z" fill="#4CAF50"/>
                    <path d="M16 6l2.29 2.29-4.88 4.88-3-3L2 17.59 3.41 19l8-8 3 3L20.59 9 22 10.41V6h-6z" fill="#4CAF50"/>
                </svg>
            </div>
            <span class="publish-studio-text">نشر فيديو استوديو</span>
        </button>
    </div>

    <div id="warningModal" class="modal-overlay">
        <div class="modal-content">
            <button onclick="closeWarningModal()" class="modal-close-btn">&times;</button>
            <p id="modalText" class="modal-text">هل تسمح بالوصول للأستوديو؟</p>
            
            <div id="permissionButtons" class="permission-buttons">
                <button onclick="handlePermissionYes()" class="btn-yes">نعم</button>
                <button onclick="closeWarningModal()" class="btn-no">لا</button>
            </div>

            <div id="studioContainer" class="studio-container">
                <input type="file" id="realStudioInput" accept="video/*" multiple style="display: none;" onchange="handleVideosSelected(event)">
                <button onclick="document.getElementById('realStudioInput').click()" class="file-select-btn">📁 اختر الفيديوهات من الاستوديو</button>
                <div id="videosGrid" class="videos-grid"></div>
            </div>

            <div id="modalOkContainer" class="modal-ok-container">
                <button id="okButton" disabled onclick="confirmSelection()" class="ok-btn">حسناً (المتابعة للنشر)</button>
            </div>

            <div id="publishPreviewStep" class="publish-preview-step">
                <video id="previewPlayer" controls playsinline class="preview-video-element"></video>
                <input type="text" id="videoTitleInput" class="video-title-input" placeholder="اكتب عنوان الفيديو هنا...">
                
                <div id="progressBarContainer" class="progress-bar-container">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                    <span id="progressText" class="progress-text">0%</span>
                </div>

                <button id="finalPublishBtn" onclick="uploadVideoToCloud()" class="final-publish-btn">نشر الفيديو سحابياً</button>
            </div>
        </div>
    </div>

    <script>
        // 1. إعدادات Supabase
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. إعدادات Firebase (تم تضمين بيانات المشروع الخاصة بك)
        const firebaseConfig = {
            apiKey: "AIzaSyBagL51Peeaa-sW0ppnYd_d-IF6Zj0IgsE",
            authDomain: "hssuhc784.firebaseapp.com",
            projectId: "hssuhc784",
            storageBucket: "hssuhc784.firebasestorage.app",
            messagingSenderId: "1072093295082",
            appId: "1:1072093295082:web:c490462c9a8e3f46860293",
            measurementId: "G-65VEXWQZWV"
        };
        firebase.initializeApp(firebaseConfig);
        const googleStorage = firebase.storage();
        if (firebase.analytics) {
            firebase.analytics();
        }

        let selectedVideoFile = null;

        function showWarningModal() {
            document.getElementById('warningModal').style.display = 'flex';
            document.getElementById('modalText').style.display = 'block';
            document.getElementById('permissionButtons').style.display = 'flex';
            document.getElementById('studioContainer').style.display = 'none';
            document.getElementById('modalOkContainer').style.display = 'block';
            document.getElementById('publishPreviewStep').style.display = 'none';
            document.getElementById('videosGrid').innerHTML = '';
            document.getElementById('videoTitleInput').value = '';
            disableOkButton();
        }

        function closeWarningModal() { document.getElementById('warningModal').style.display = 'none'; }

        function handlePermissionYes() {
            document.getElementById('modalText').style.display = 'none';
            document.getElementById('permissionButtons').style.display = 'none';
            document.getElementById('studioContainer').style.display = 'block';
            document.getElementById('realStudioInput').click();
        }

        function handleVideosSelected(event) {
            const files = event.target.files;
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = '';
            disableOkButton();

            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type.startsWith('video/')) {
                        const videoURL = URL.createObjectURL(file);
                        const thumbCard = document.createElement('div');
                        thumbCard.className = 'video-thumb-card';
                        thumbCard.innerHTML = `<video src="${videoURL}"></video><span>${file.name}</span>`;

                        thumbCard.onclick = function() {
                            document.querySelectorAll('.video-thumb-card').forEach(c => c.classList.remove('selected'));
                            thumbCard.classList.add('selected');
                            selectedVideoFile = file;
                            enableOkButton();
                        };
                        grid.appendChild(thumbCard);

                        if (i === 0 && files.length === 1) {
                            thumbCard.click();
                        }
                    }
                }
            }
        }

        function enableOkButton() {
            const btn = document.getElementById('okButton');
            btn.disabled = false;
            btn.style.background = '#4CAF50';
            btn.style.cursor = 'pointer';
        }

        function disableOkButton() {
            const btn = document.getElementById('okButton');
            btn.disabled = true;
            btn.style.background = '#cccccc';
            btn.style.cursor = 'not-allowed';
        }

        function confirmSelection() {
            if (selectedVideoFile) {
                document.getElementById('studioContainer').style.display = 'none';
                document.getElementById('modalOkContainer').style.display = 'none';

                const previewStep = document.getElementById('publishPreviewStep');
                const player = document.getElementById('previewPlayer');
                
                player.setAttribute('playsinline', '');
                const safeUrl = URL.createObjectURL(selectedVideoFile);
                player.src = safeUrl;
                player.load();
                
                previewStep.style.display = 'block';
            }
        }

        async function uploadVideoToCloud() {
            const title = document.getElementById('videoTitleInput').value.trim();

            if (!title) {
                alert("يرجى كتابة عنوان للفيديو قبل النشر.");
                return;
            }

            if (!selectedVideoFile) {
                alert("يرجى اختيار فيديو من القائمة أولاً.");
                return;
            }

            const publishBtn = document.getElementById('finalPublishBtn');
            const progressContainer = document.getElementById('progressBarContainer');
            const progressFill = document.getElementById('progressBarFill');
            const progressText = document.getElementById('progressText');

            publishBtn.disabled = true;
            publishBtn.style.background = '#cccccc';
            progressContainer.style.display = 'block';

            try {
                // اسم ملف فريد للرفع إلى خوادم جوجل
                const cleanFileName = `videos/${Date.now()}_${selectedVideoFile.name}`;
                const storageRef = googleStorage.ref(cleanFileName);
                const uploadTask = storageRef.put(selectedVideoFile);

                // متابعة نسبة الرفع الحقيقية إلى خوادم جوجل
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        progressFill.style.width = `${progress}%`;
                        progressText.innerText = `جاري الرفع لجوجل: ${progress}%`;
                    }, 
                    (error) => {
                        console.error("Google Storage Error:", error);
                        alert("فشل رفع الفيديو إلى خوادم جوجل: " + error.message);
                        publishBtn.disabled = false;
                        publishBtn.style.background = '#4CAF50';
                        progressContainer.style.display = 'none';
                    }, 
                    async () => {
                        // 1. استخراج الرابط المباشر من جوجل
                        const googleVideoUrl = await uploadTask.snapshot.ref.getDownloadURL();

                        if (!googleVideoUrl) {
                            alert("تعذر جلب رابط الفيديو من خوادم جوجل.");
                            publishBtn.disabled = false;
                            publishBtn.style.background = '#4CAF50';
                            progressContainer.style.display = 'none';
                            return;
                        }

                        const currentUser = localStorage.getItem('user_email') || 'User';

                        const videoData = {
                            title: title,
                            url: googleVideoUrl,
                            video_url: googleVideoUrl,
                            author: currentUser,
                            username: currentUser,
                            created_at: new Date().toISOString()
                        };

                        // 2. حفظ الرابط فقط داخل قاعدة بيانات Supabase
                        const { error: dbError } = await supabaseClient
                            .from('videos')
                            .insert([videoData]);

                        if (dbError) {
                            alert("خطأ في حفظ البيانات بقاعدة بيانات Supabase: " + dbError.message);
                            publishBtn.disabled = false;
                            publishBtn.style.background = '#4CAF50';
                            progressContainer.style.display = 'none';
                            return;
                        }

                        // 3. حفظ البيانات محلياً للمزامنة السريعة
                        try {
                            let localVideos = JSON.parse(localStorage.getItem('videos') || '[]');
                            localVideos.unshift(videoData);
                            localStorage.setItem('videos', JSON.stringify(localVideos));

                            let localUploaded = JSON.parse(localStorage.getItem('uploadedVideos') || '[]');
                            localUploaded.unshift(videoData);
                            localStorage.setItem('uploadedVideos', JSON.stringify(localUploaded));
                        } catch (e) {
                            console.error("LocalStorage Save Error:", e);
                        }

                        progressFill.style.width = '100%';
                        progressText.innerText = 'تم النشر بنجاح!';

                        setTimeout(() => {
                            window.location.href = 'inndex.html';
                        }, 600);
                    }
                );

            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء رفع الفيديو.");
                publishBtn.disabled = false;
                publishBtn.style.background = '#4CAF50';
                progressContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
