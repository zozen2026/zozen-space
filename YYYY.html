<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر الفيديو - YYYY</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F4EAE1;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h3 {
            margin-top: 0;
            color: rgb(255, 136, 0);
            text-align: center;
            font-size: 22px;
        }
        .preview-box {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgb(255, 136, 0);
        }
        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .section-label {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: rgb(255, 136, 0);
        }
        textarea {
            resize: vertical;
            height: 80px;
        }

        /* الجماهير المستهدفة */
        .audience-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tag-chip {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            background: #f9f9f9;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .tag-chip.selected {
            background: rgb(255, 136, 0);
            color: white;
            border-color: rgb(255, 136, 0);
            font-weight: bold;
        }

        /* خيار إيقاف التعليقات */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: rgb(255, 136, 0);
            cursor: pointer;
        }

        #publishBtn {
            background-color: rgb(255, 136, 0);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            display: none;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        #publishBtn:hover {
            background-color: #e67e00;
        }
        #msg {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>نشر المنشور</h3>

    <div class="preview-box">
        <p id="msg">جاري سحب الفيديو...</p>
        <video id="pulledVideo" controls style="display: none;"></video>
    </div>

    <!-- عنوان الفيديو -->
    <div class="form-group">
        <input type="text" id="videoTitle" placeholder="عنوان الفيديو..." oninput="validateForm()">
    </div>

    <!-- وصف الفيديو -->
    <div class="form-group">
        <textarea id="videoDesc" placeholder="وصف الفيديو (اختياري)..."></textarea>
    </div>

    <!-- الدولة المستهدفة -->
    <div class="form-group">
        <label class="section-label">الدولة المستهدفة:</label>
        <input type="text" id="targetCountry" placeholder="مثال: العراق، السعودية، مصر...">
    </div>

    <!-- الجمهور المستهدف -->
    <div class="form-group">
        <label class="section-label">اختر الجمهور المستهدف (اختر واحدة أو أكثر):</label>
        <div class="audience-tags" id="audienceContainer">
            <div class="tag-chip" onclick="toggleAudience(this, 'ألعاب')">🎮 ألعاب</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'تقنية')">💻 تقنية</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'ترفيه')">🎬 ترفيه</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'تعليم')">📚 تعليم</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'رياضة')">⚽ رياضة</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'موسيقى')">🎵 موسيقى</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'صحة')">🧘 صحة</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'أعمال')">💼 أعمال</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'طبخ')">🍳 طبخ</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'سفر')">✈️ سفر</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'موضة وجمال')">💄 موضة وجمال</div>
            <div class="tag-chip" onclick="toggleAudience(this, 'سيارات')">🚗 سيارات</div>
        </div>
    </div>

    <!-- إيقاف التعليقات -->
    <div class="checkbox-group">
        <input type="checkbox" id="disableComments">
        <label for="disableComments">إيقاف التعليقات على هذا الفيديو</label>
    </div>

    <button id="publishBtn" onclick="publishVideo()">نشر</button>
</div>

<script>
    const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let videoDataUrl = "";
    let currentUsername = "default_user";
    let selectedAudiences = [];

    window.addEventListener("DOMContentLoaded", () => {
        videoDataUrl = sessionStorage.getItem("capturedVideo");

        let savedUsername = localStorage.getItem('user_username');
        if (savedUsername) {
            currentUsername = savedUsername;
        }

        const videoElement = document.getElementById("pulledVideo");
        const msg = document.getElementById("msg");

        if (videoDataUrl) {
            videoElement.src = videoDataUrl;
            msg.style.display = "none";
            videoElement.style.display = "block";
            validateForm();
        } else {
            msg.innerText = "لم يتم العثور على فيديو مسحب!";
        }
    });

    function toggleAudience(element, category) {
        element.classList.toggle("selected");
        if (selectedAudiences.includes(category)) {
            selectedAudiences = selectedAudiences.filter(item => item !== category);
        } else {
            selectedAudiences.push(category);
        }
    }

    function validateForm() {
        const title = document.getElementById('videoTitle').value.trim();
        const btn = document.getElementById('publishBtn');

        if (title.length > 0 && videoDataUrl !== "") {
            btn.style.display = 'block';
        } else {
            btn.style.display = 'none';
        }
    }

    async function publishVideo() {
        const title = document.getElementById('videoTitle').value.trim();
        const desc = document.getElementById('videoDesc').value.trim();
        const targetCountry = document.getElementById('targetCountry').value.trim();
        const disableComments = document.getElementById('disableComments').checked;
        const btn = document.getElementById('publishBtn');

        if (!title || !videoDataUrl) return;

        btn.innerText = "جاري النشر سحابياً...";
        btn.disabled = true;

        // إعداد البيانات المراد إرسالها لـ Supabase
        const payload = {
            title: title,
            description: desc,
            video_url: videoDataUrl,
            author: currentUsername
        };

        // إضافة الحقول الإضافية إذا تم تحديدها
        if (targetCountry) payload.target_country = targetCountry;
        if (selectedAudiences.length > 0) payload.target_audience = selectedAudiences;
        if (disableComments) payload.disable_comments = true;

        try {
            const { error: dbError } = await supabaseClient
                .from('videos')
                .insert([payload]);

            if (dbError) {
                console.error("خطأ في رفع الفيديو للقاعدة:", dbError.message);
                alert("حدث خطأ أثناء النشر: " + dbError.message);
                btn.innerText = "نشر";
                btn.disabled = false;
                return;
            }

            // حفظ نسخة احتياطية محلية
            let globalPosts = JSON.parse(localStorage.getItem('all_published_videos') || '[]');
            globalPosts.unshift({
                id: Date.now(),
                title: title,
                desc: desc,
                url: videoDataUrl,
                author: currentUsername,
                target_country: targetCountry,
                target_audience: selectedAudiences,
                disable_comments: disableComments,
                date: new Date().toISOString()
            });
            localStorage.setItem('all_published_videos', JSON.stringify(globalPosts));

            // التوجيه مباشرة إلى profile2.html
            window.location.href = "profile2.html";

        } catch (err) {
            console.error("خطأ غير متوقع:", err);
            alert("حدث خطأ غير متوقع.");
            btn.innerText = "نشر";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
