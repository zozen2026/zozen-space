<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Orange Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F4EAE1;
            --card-bg: #FFFFFF;
            --accent-color: #ff6600;
            --text-main: #2C2C2C;
            --text-muted: #888888;
            --border-light: #E5DCD4;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .signup-container {
            background: var(--card-bg);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 102, 0, 0.1);
            color: var(--accent-color);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            margin: 0 auto 15px auto;
        }

        .brand-header h2 {
            color: var(--text-main);
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .brand-header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 14px 15px;
            background: #FAFAFA;
            border: 1.5px solid var(--border-light);
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
            appearance: none;
        }

        /* ضبط أماكن الأيقونات والنصوص بناءً على الاتجاه */
        [dir="rtl"] .input-wrapper input, [dir="rtl"] .input-wrapper select {
            padding-right: 45px;
            padding-left: 15px;
            text-align: right;
        }
        [dir="rtl"] .input-wrapper i {
            right: 16px;
            left: auto;
        }

        [dir="ltr"] .input-wrapper input, [dir="ltr"] .input-wrapper select {
            padding-left: 45px;
            padding-right: 15px;
            text-align: left;
        }
        [dir="ltr"] .input-wrapper i {
            left: 16px;
            right: auto;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--accent-color);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .signup-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #e55c00;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.35);
        }

        .error-msg {
            color: #d93838;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: rgba(217, 56, 56, 0.08);
            padding: 10px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(217, 56, 56, 0.15);
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-header">
            <div class="icon-box">
                <i class="fas fa-video"></i>
            </div>
            <h2 id="uiTitle">Create New Account</h2>
            <p id="uiSubTitle">Your Personal Video Library</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        
        <form id="accountForm">
            <!-- اختيار اللغة بالترتيب المطلوبة -->
            <div class="input-group">
                <label id="lblLanguage">Language</label>
                <div class="input-wrapper">
                    <i class="fas fa-globe"></i>
                    <select id="languageSelect" onchange="changeLanguage(this.value)">
                        <!-- 1. أمريكا -->
                        <option value="en-US" selected>English (United States)</option>
                        <!-- 2. بريطانيا -->
                        <option value="en-GB">English (United Kingdom)</option>
                        <!-- 3. عربي -->
                        <option value="ar">العربية</option>
                        <!-- 4. روسي -->
                        <option value="ru">Русский</option>
                        <!-- 5. باقي اللغات -->
                        <option value="hi">हिन्दी</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="tr">Türkçe</option>
                        <option value="fa">فارسی</option>
                        <option value="ur">اردو</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="uk">Українська</option>
                    </select>
                </div>
            </div>

            <!-- 1. اسم المستخدم (مع شرط @) -->
            <div class="input-group">
                <label id="lblUsername">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-at"></i>
                    <input type="text" id="username" placeholder="@username" required>
                </div>
            </div>

            <!-- 2. اسم الحساب -->
            <div class="input-group">
                <label id="lblAccountName">Account Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="accountName" placeholder="Display Name" required>
                </div>
            </div>
            
            <!-- 3. مفتاح الدخول (كلمة السر) -->
            <div class="input-group">
                <label id="lblPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="signup-btn" id="btnSubmit">Get Started</button>
        </form>
    </div>

    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // قاموس الترجمات الخاص بكل لغة
        const translations = {
            "en-US": {
                title: "Create New Account",
                subtitle: "Your Personal Video Library",
                langLabel: "Language",
                userLabel: "Username",
                accLabel: "Account Name",
                passLabel: "Password",
                btnText: "Get Started",
                placeholderUser: "@username",
                placeholderAcc: "Display Name",
                errAt: "Username must start with @ character"
            },
            "en-GB": {
                title: "Create New Account",
                subtitle: "Your Personal Video Library",
                langLabel: "Language",
                userLabel: "Username",
                accLabel: "Account Name",
                passLabel: "Password",
                btnText: "Get Started",
                placeholderUser: "@username",
                placeholderAcc: "Display Name",
                errAt: "Username must start with @ character"
            },
            ar: {
                title: "إنشاء حساب جديد",
                subtitle: "مكتبة الفيديوهات الخاصة بك",
                langLabel: "اللغة",
                userLabel: "اسم المستخدم",
                accLabel: "اسم الحساب",
                passLabel: "مفتاح الدخول",
                btnText: "بدء الاستخدام",
                placeholderUser: "@اسم_المستخدم",
                placeholderAcc: "الاسم الظاهر",
                errAt: "يجب أن يبدأ اسم المستخدم بحرف @ إجبارياً"
            },
            ru: {
                title: "Создать аккаунт",
                subtitle: "Ваша видеотека",
                langLabel: "Язык",
                userLabel: "Имя пользователя",
                accLabel: "Отображаемое имя",
                passLabel: "Пароль",
                btnText: "Начать",
                placeholderUser: "@имя_пользователя",
                placeholderAcc: "Отображаемое имя",
                errAt: "Имя пользователя должно начинаться с символа @"
            },
            hi: {
                title: "नया खाता बनाएं",
                subtitle: "आपकी वीडियो लाइब्रेरी",
                langLabel: "भाषा",
                userLabel: "उपयोगकर्ता नाम",
                accLabel: "खाते का नाम",
                passLabel: "पासवर्ड",
                btnText: "शुरू करें",
                placeholderUser: "@उपयोगकर्ता",
                placeholderAcc: "प्रदर्शित नाम",
                errAt: "उपयोगकर्ता नाम @ से शुरू होना अनिवार्य है"
            },
            it: {
                title: "Crea nuovo account",
                subtitle: "La tua libreria video",
                langLabel: "Lingua",
                userLabel: "Nome utente",
                accLabel: "Nome account",
                passLabel: "Password",
                btnText: "Inizia",
                placeholderUser: "@nome_utente",
                placeholderAcc: "Nome visualizzato",
                errAt: "Il nome utente deve iniziare con @"
            },
            es: {
                title: "Crear nueva cuenta",
                subtitle: "Tu biblioteca de videos",
                langLabel: "Idioma",
                userLabel: "Nombre de usuario",
                accLabel: "Nombre de la cuenta",
                passLabel: "Contraseña",
                btnText: "Comenzar",
                placeholderUser: "@usuario",
                placeholderAcc: "Nombre visible",
                errAt: "El nombre de usuario debe comenzar con @"
            },
            fr: {
                title: "Créer un compte",
                subtitle: "Votre bibliothèque vidéo",
                langLabel: "Langue",
                userLabel: "Nom d'utilisateur",
                accLabel: "Nom du compte",
                passLabel: "Mot de passe",
                btnText: "Commencer",
                placeholderUser: "@nom_utilisateur",
                placeholderAcc: "Nom d'affichage",
                errAt: "Le nom d'utilisateur doit commencer par @"
            },
            de: {
                title: "Neues Konto erstellen",
                subtitle: "Ihre Videobibliothek",
                langLabel: "Sprache",
                userLabel: "Benutzername",
                accLabel: "Kontiname",
                passLabel: "Passwort",
                btnText: "Starten",
                placeholderUser: "@benutzername",
                placeholderAcc: "Anzeigename",
                errAt: "Der Benutzername muss mit @ beginnen"
            },
            tr: {
                title: "Yeni Hesap Oluştur",
                subtitle: "Video Kütüphaneniz",
                langLabel: "Dil",
                userLabel: "Kullanıcı Adı",
                accLabel: "Hesap Adı",
                passLabel: "Şifre",
                btnText: "Başla",
                placeholderUser: "@kullanici_adi",
                placeholderAcc: "Görünen Ad",
                errAt: "Kullanıcı adı @ ile başlamalıdır"
            }
        };

        // دالة تغيير اللغة والاتجاه والنصوص بالكامل
        function changeLanguage(langCode) {
            const htmlRoot = document.getElementById('htmlRoot');
            const rtlLangs = ['ar', 'fa', 'ur'];

            // تغيير الاتجاه (RTL/LTR)
            if (rtlLangs.includes(langCode)) {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }
            htmlRoot.setAttribute('lang', langCode);

            // جلب الترجمة المطلوبة أو استخدام الإنجليزية كافتراضي
            const t = translations[langCode] || translations['en-US'];

            document.getElementById('uiTitle').innerText = t.title;
            document.getElementById('uiSubTitle').innerText = t.subtitle;
            document.getElementById('lblLanguage').innerText = t.langLabel;
            document.getElementById('lblUsername').innerText = t.userLabel;
            document.getElementById('lblAccountName').innerText = t.accLabel;
            document.getElementById('lblPassword').innerText = t.passLabel;
            document.getElementById('btnSubmit').innerText = t.btnText;
            
            // تغيير النصوص التوضيحية داخل المدخلات بلغة الصفحة
            document.getElementById('username').placeholder = t.placeholderUser;
            document.getElementById('accountName').placeholder = t.placeholderAcc;
        }

        // تشغيل اللغة الافتراضية عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            changeLanguage(document.getElementById('languageSelect').value);
        });

        // معالجة نموذج التسجيل
        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedLang = document.getElementById('languageSelect').value;
            const username = document.getElementById('username').value.trim();
            const accountName = document.getElementById('accountName').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            
            const t = translations[selectedLang] || translations['en-US'];
            errorDiv.style.display = 'none';

            // الشرط الإجباري: التحقق من أن اسم المستخدم يبدأ بـ @
            if (!username.startsWith('@')) {
                errorDiv.innerText = t.errAt;
                errorDiv.style.display = 'block';
                return;
            }

            // توليد رابط الصورة الرمزية التلقائية بناءً على الاسم
            const userAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(accountName)}&background=ff6600&color=fff`;

            // 1. التخزين المحلي الشامل في LocalStorage
            const currentUserData = {
                username: username,
                accountName: accountName,
                password: password,
                language: selectedLang,
                avatar: userAvatar
            };

            localStorage.setItem('currentUser', JSON.stringify(currentUserData));
            localStorage.setItem('user_username', username);
            localStorage.setItem('user_account_name', accountName);
            localStorage.setItem('user_password', password);
            localStorage.setItem('user_language', selectedLang);

            // 2. التخزين السحابي عبر Supabase
            try {
                const { error: authError } = await supabaseClient.auth.signUp({
                    email: username.replace('@', '') + "@orange.local",
                    password: password
                });

                if (authError) {
                    console.log("Auth note:", authError.message);
                }

                // إدخال البيانات في جدول accounts المخصص
                const { error: dbError } = await supabaseClient
                    .from('accounts')
                    .insert([
                        { 
                            username: username, 
                            account_name: accountName, 
                            password: password,
                            language: selectedLang
                        }
                    ]);

                if (dbError) {
                    console.error("خطأ في إدخال الجدول:", dbError.message);
                    errorDiv.innerText = dbError.message;
                    errorDiv.style.display = 'block';
                    return;
                }

            } catch (err) {
                console.log("Cloud sync note:", err);
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
                return;
            }

            // الانتقال المباشر إلى inndex.html بعد النجاح التام
            window.location.href = 'inndex.html';
        });
    </script>
</body>
</html>
