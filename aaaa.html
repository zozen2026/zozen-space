<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Orange Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F4EAE1;
            --card-bg: #FFFFFF;
            --accent-color: #ff6600;
            --text-main: #2C2C2C;
            --text-muted: #888888;
            --border-light: #E5DCD4;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .signup-container {
            background: var(--card-bg);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 102, 0, 0.1);
            color: var(--accent-color);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            margin: 0 auto 15px auto;
        }

        .brand-header h2 {
            color: var(--text-main);
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .brand-header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #FAFAFA;
            border: 1.5px solid var(--border-light);
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: left;
            direction: ltr;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-color);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .signup-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #e55c00;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.35);
        }

        .error-msg {
            color: #d93838;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: rgba(217, 56, 56, 0.08);
            padding: 10px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(217, 56, 56, 0.15);
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-header">
            <div class="icon-box">
                <i class="fas fa-video"></i>
            </div>
            <h2>Zozen account</h2>
            <p>مكتبة الفيديوهات الخاصة بك</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        
        <form id="accountForm">
            <!-- 1. اسم المستخدم (مع شرط @) -->
            <div class="input-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fas fa-at"></i>
                    <input type="text" id="username" placeholder="@username" required>
                </div>
            </div>

            <!-- 2. اسم الحساب -->
            <div class="input-group">
                <label>اسم الحساب</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="accountName" placeholder="الاسم الظاهر" required>
                </div>
            </div>
            
            <!-- 3. مفتاح الدخول (كلمة السر) -->
            <div class="input-group">
                <label>مفتاح الدخول</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="signup-btn">بدء الاستخدام</button>
        </form>
    </div>

    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const accountName = document.getElementById('accountName').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.style.display = 'none';

            // الشرط الإجباري: التحقق من أن اسم المستخدم يبدأ بـ @
            if (!username.startsWith('@')) {
                errorDiv.innerText = "يجب أن يبدأ اسم المستخدم بحرف @ إجبارياً";
                errorDiv.style.display = 'block';
                return;
            }

            // 1. التخزين المحلي في الجهاز
            localStorage.setItem('user_username', username);
            localStorage.setItem('user_account_name', accountName);
            localStorage.setItem('user_password', password);
            localStorage.setItem('user_email', username);

            // 2. التخزين السحابي عبر Supabase (تسجيل + إدخال مباشر في جدول accounts)
            try {
                const { error: authError } = await supabaseClient.auth.signUp({
                    email: username.replace('@', '') + "@orange.local",
                    password: password
                });

                if (authError) {
                    console.log("Auth note:", authError.message);
                }

                // إدخال البيانات في جدول accounts المخصص
                const { error: dbError } = await supabaseClient
                    .from('accounts')
                    .insert([
                        { 
                            username: username, 
                            account_name: accountName, 
                            password: password 
                        }
                    ]);

                if (dbError) {
                    console.error("خطأ في إدخال الجدول:", dbError.message);
                    errorDiv.innerText = "خطأ في حفظ الحساب بالقاعدة: " + dbError.message;
                    errorDiv.style.display = 'block';
                    return;
                }

            } catch (err) {
                console.log("Cloud sync note:", err);
                errorDiv.innerText = "حدث خطأ غير متوقع: " + err.message;
                errorDiv.style.display = 'block';
                return;
            }

            // الانتقال المباشر إلى inndex.html بعد النجاح التام
            window.location.href = 'inndex.html';
        });
    </script>
</body>
</html>
