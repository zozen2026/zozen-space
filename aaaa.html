<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Orange Design</title>
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F4EAE1;
            --card-bg: #FFFFFF;
            --accent-color: #ff6600;
            --text-main: #2C2C2C;
            --text-muted: #888888;
            --border-light: #E5DCD4;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .signup-container {
            background: var(--card-bg);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 102, 0, 0.1);
            color: var(--accent-color);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            margin: 0 auto 15px auto;
        }

        .brand-header h2 {
            color: var(--text-main);
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .brand-header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 14px 15px;
            background: #FAFAFA;
            border: 1.5px solid var(--border-light);
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
            appearance: none;
        }

        /* تعديلات الاتجاه RTL و LTR */
        [dir="rtl"] .input-wrapper input, [dir="rtl"] .input-wrapper select {
            padding-right: 45px;
            padding-left: 15px;
            text-align: right;
        }
        [dir="rtl"] .input-wrapper i {
            right: 16px;
            left: auto;
        }

        [dir="ltr"] .input-wrapper input, [dir="ltr"] .input-wrapper select {
            padding-left: 45px;
            padding-right: 15px;
            text-align: left;
        }
        [dir="ltr"] .input-wrapper i {
            left: 16px;
            right: auto;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--accent-color);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .signup-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #e55c00;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.35);
        }

        .signup-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .login-link-container {
            text-align: center;
            margin-top: 20px;
        }

        .login-link-container a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .login-link-container a:hover {
            text-decoration: underline;
            color: #e55c00;
        }

        .error-msg {
            color: #d93838;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: rgba(217, 56, 56, 0.08);
            padding: 10px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(217, 56, 56, 0.15);
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-header">
            <div class="icon-box">
                <i class="fas fa-video"></i>
            </div>
            <h2 id="uiTitle">إنشاء حساب جديد</h2>
            <p id="uiSubTitle">مكتبة الفيديوهات الخاصة بك</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        
        <form id="accountForm">
            <!-- اختيار اللغة -->
            <div class="input-group">
                <label id="lblLanguage">اللغة</label>
                <div class="input-wrapper">
                    <i class="fas fa-globe"></i>
                    <select id="languageSelect" onchange="changeLanguage(this.value)">
                        <option value="ar" selected>العربية</option>
                        <option value="en-US">English (United States)</option>
                        <option value="en-GB">English (United Kingdom)</option>
                        <option value="ru">Русский</option>
                        <option value="hi">हिन्दी</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="tr">Türkçe</option>
                        <option value="fa">فارسی</option>
                        <option value="ur">اردو</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="uk">Українська</option>
                    </select>
                </div>
            </div>

            <!-- 1. اسم المستخدم (username) -->
            <div class="input-group">
                <label id="lblUsername">اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fas fa-at"></i>
                    <input type="text" id="username" placeholder="@اسم_المستخدم" required>
                </div>
            </div>

            <!-- 2. اسم الحساب (account_name) -->
            <div class="input-group">
                <label id="lblAccountName">اسم الحساب</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="accountName" placeholder="الاسم الظاهر" required>
                </div>
            </div>
            
            <!-- 3. مفتاح الدخول (access_key) -->
            <div class="input-group">
                <label id="lblPassword">مفتاح الدخول</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="signup-btn" id="btnSubmit">بدء الاستخدام</button>

            <!-- رابط الانتقال لصفحة aa.html -->
            <div class="login-link-container">
                <a href="aa.html" id="linkLogin">هل عندك حساب؟ سجل دخول هنا!</a>
            </div>
        </form>
    </div>

    <script>
        // إعدادات اتصال Supabase الخاصة بمشروعك
        const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";

        // إنشاء عميل Supabase
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // القاموس المترجم للغات
        const translations = {
            "en-US": {
                title: "Create New Account",
                subtitle: "Your Personal Video Library",
                langLabel: "Language",
                userLabel: "Username",
                accLabel: "Account Name",
                passLabel: "Access Key",

            },
            "en-GB": {

                subtitle: "Your Personal Video Library",
                langLabel: "Language",
                userLabel: "Username",
                accLabel: "Account Name",
                passLabel: "Access Key",
                btnText: "Get Started",
                placeholderUser: "@username",
                placeholderAcc: "Display Name",
                errAt: "Username must start with @ character",
                loginLink: "Already have an account? Log in here!"
            },
            ar: {
                title: "إنشاء حساب جديد",
                subtitle: "مكتبة الفيديوهات الخاصة بك",
                langLabel: "اللغة",
                userLabel: "اسم المستخدم",
                accLabel: "اسم الحساب",
                passLabel: "مفتاح الدخول",
                btnText: "بدء الاستخدام",
                placeholderUser: "@اسم_المستخدم",
                placeholderAcc: "الاسم الظاهر",
                errAt: "يجب أن يبدأ اسم المستخدم بحرف @ إجبارياً",
                loginLink: "هل عندك حساب؟ سجل دخول هنا!"
            },
            ru: {
                title: "Создать аккаунт",
                subtitle: "Ваша видеотека",
                langLabel: "Язык",
                userLabel: "Имя пользователя",
                accLabel: "Отображаемое имя",
                passLabel: "Ключ доступа",
                btnText: "Начать",
                placeholderUser: "@имя_пользователя",
                placeholderAcc: "Отображаемое имя",
                errAt: "Имя пользователя должно начинаться с символа @",
                loginLink: "Уже есть аккаунт? Войдите здесь!"
            },
            hi: {
                title: "नया खाता बनाएं",
                subtitle: "आपकी वीडियो लाइब्रेरी",
                langLabel: "भाषा",

                accLabel: "खाते का नाम",
                passLabel: "एक्सेस कुंजी",
                btnText: "शुरू करें",
                placeholderUser: "@उपयोगकर्ता",
                placeholderAcc: "प्रदर्शित नाम",
                errAt: "उपयोगकर्ता नाम @ से शुरू होना अनिवार्य है",
                loginLink: "क्या आपके पास पहले से खाता है? यहाँ लॉगिन करें!"
            },
            it: {
                title: "Crea nuovo account",
                subtitle: "La tua libreria video",
                langLabel: "Lingua",
                userLabel: "Nome utente",
                accLabel: "Nome account",
                passLabel: "Chiave di accesso",

            },
            es: {

                subtitle: "Tu biblioteca de videos",
                langLabel: "Idioma",
                userLabel: "Nombre de usuario",

                passLabel: "Clave de acceso",
                btnText: "Comenzar",
                placeholderUser: "@usuario",
                placeholderAcc: "Nombre visible",
                errAt: "El nombre de usuario debe comenzar con @",
                loginLink: "¿Ya tienes una cuenta? ¡Inicia sesión aquí!"
            },
            fr: {
                title: "Créer un compte",
                subtitle: "Votre bibliothèque vidéo",
                langLabel: "Langue",
                userLabel: "Nom d'utilisateur",
                accLabel: "Nom du compte",
                passLabel: "Clé d'accès",
                btnText: "Commencer",
                placeholderUser: "@nom_utilisateur",
                placeholderAcc: "Nom d'affichage",
                errAt: "Le nom d'utilisateur doit commencer par @",
                loginLink: "Vous avez déjà un compte ? Connectez-vous ici !"
            },
            de: {
                title: "Neues Konto erstellen",
                subtitle: "Ihre Videobibliothek",
                langLabel: "Sprache",
                userLabel: "Benutzername",
                accLabel: "Kontiname",
                passLabel: "Zugangsschlüssel",
                btnText: "Starten",
                placeholderUser: "@benutzername",
                placeholderAcc: "Anzeigename",
                errAt: "Der Benutzername muss mit @ beginnen",
                loginLink: "Haben Sie bereits ein Konto? Hier anmelden!"
            },
            tr: {
                title: "Yeni Hesap Oluştur",
                subtitle: "Video Kütüphaneniz",
                langLabel: "Dil",
                userLabel: "Kullanıcı Adı",
                accLabel: "Hesap Adı",
                passLabel: "Erişim Anahtarı",
                btnText: "Başla",
                placeholderUser: "@kullanici_adi",
                placeholderAcc: "Görünen Ad",
                errAt: "Kullanıcı adı @ ile başlamalıdır",
                loginLink: "Zaten bir hesabınız var mı? Burada giriş yapın!"
            }
        };

        // تغيير اللغة والاتجاه تلقائياً
        function changeLanguage(langCode) {
            const htmlRoot = document.getElementById('htmlRoot');
            const rtlLangs = ['ar', 'fa', 'ur'];

            htmlRoot.setAttribute('dir', rtlLangs.includes(langCode) ? 'rtl' : 'ltr');
            htmlRoot.setAttribute('lang', langCode);

            const t = translations[langCode] || translations['en-US'];

            document.getElementById('uiTitle').innerText = t.title;
            document.getElementById('uiSubTitle').innerText = t.subtitle;
            document.getElementById('lblLanguage').innerText = t.langLabel;
            document.getElementById('lblUsername').innerText = t.userLabel;
            document.getElementById('lblAccountName').innerText = t.accLabel;
            document.getElementById('lblPassword').innerText = t.passLabel;
            document.getElementById('btnSubmit').innerText = t.btnText;
            document.getElementById('linkLogin').innerText = t.loginLink || "هل عندك حساب؟ سجل دخول هنا!";
            
            document.getElementById('username').placeholder = t.placeholderUser;
            document.getElementById('accountName').placeholder = t.placeholderAcc;
        }

        window.addEventListener('DOMContentLoaded', () => {
            changeLanguage(document.getElementById('languageSelect').value);
        });

        // التعامل مع تقديم النموذج والإرسال لقاعدة البيانات
        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedLang = document.getElementById('languageSelect').value;
            const username = document.getElementById('username').value.trim();
            const accountName = document.getElementById('accountName').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnSubmit');
            
            const t = translations[selectedLang] || translations['en-US'];
            errorDiv.style.display = 'none';

            // 1. التثبت من شرط البدء بـ @
            if (!username.startsWith('@')) {
                errorDiv.innerText = t.errAt;
                errorDiv.style.display = 'block';
                return;
            }

            // تعطيل الزر لمنع الضغط المكرر أثناء الإرسال
            btnSubmit.disabled = true;

            // 2. حفظ الحساب في LocalStorage للسرعة والاستجابة
            const currentUserData = {
                username: username,
                accountName: accountName,
                password: password,
                language: selectedLang
            };
            localStorage.setItem('currentUser', JSON.stringify(currentUserData));

            // 3. إرسال البيانات مباشرة للجدول accounts بالخادم وفق أسماء الأعمدة الدقيقة:
            // (username, account_name, access_key)
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('accounts')
                        .insert([
                            { 
                                username: username, 
                                account_name: accountName, 
                                access_key: password 
                            }
                        ]);

                    if (error) {
                        console.error("Supabase Insert Error:", error.message);
                    } else {
                        console.log("Success Insert into Supabase:", data);
                    }
                } catch (err) {
                    console.error("Connection Error:", err);
                }
            }

            // 4. التحويل المضمون والفوري إلى ملف inndex.html
            window.location.href = 'inndex.html';
        });
    </script>
