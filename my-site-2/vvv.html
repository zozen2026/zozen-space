<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مستقبل الفيديو - vvv</title>
    <style>
        body { 
            background: #0a0a0a; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-family: sans-serif;
            color: #fff;
            position: relative;
            user-select: none;
        }

        .back-nav-circle {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #e74c3c; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.3s ease;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.2);
            z-index: 10;
        }
        .back-nav-circle:hover {
            opacity: 1;
            background: #e74c3c;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
            transform: scale(1.05);
        }
        .back-arrow-right { 
            width: 10px; 
            height: 10px; 
            border-right: 2px solid #fff; 
            border-bottom: 2px solid #fff; 
            transform: rotate(135deg); 
            margin-right: 4px;
        }

        .video-container {
            width: 80%;
            max-width: 700px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none; 
            border: 4px solid #ffd700; 
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            position: relative;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 20px;
            max-width: 80%;
            text-align: center;
            word-wrap: break-word;
            cursor: move;
            display: none;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 1px dashed rgba(255,215,0,0.3);
        }

        .controls-container {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .buttons-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 25px;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .btn-action:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .success-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #2ecc71;
            color: #2ecc71;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }
        .success-btn:hover {
            background: #2ecc71;
            color: #fff;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
            transform: scale(1.05);
        }

        .input-box-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .text-input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            background: #111;
            color: #fff;
            font-size: 16px;
            outline: none;
            width: 250px;
        }

        #status-msg {
            font-size: 18px;
            color: #666;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <a href="llll.html" class="back-nav-circle" title="العودة للتسجيل">
        <div class="back-arrow-right"></div>
    </a>

    <div id="status-msg">جاري تحميل الفيديو المسجل...</div>

    <div class="video-container" id="vid-box">
        <video id="recordedVideo" controls autoplay></video>
        <div class="overlay-text" id="video-overlay-text">انقر ثم اسحب لتحريكي!</div>
    </div>

    <div class="controls-container" id="controls-box">
        <div class="input-box-container" id="input-container">
            <input type="text" id="user-text" class="text-input" placeholder="اكتب النص هنا...">
            <button class="success-btn" id="confirm-text-btn" title="تأكيد النص">✓</button>
        </div>

        <div class="buttons-row">
            <button class="btn-action" id="add-text-btn">إضافة نص</button>
            <!-- زر الانتقال لملف YYYY مع تفعيل سحب الفيديو -->
            <button class="success-btn" onclick="enableAndProceedToYYYY()" title="الانتقال للنشر">✓</button>
        </div>
    </div>

    <script>
        let currentVideoBase64 = "";

        document.addEventListener("DOMContentLoaded", () => {
            currentVideoBase64 = sessionStorage.getItem("capturedVideo");
            const statusMsg = document.getElementById("status-msg");
            const videoBox = document.getElementById("vid-box");
            const controlsBox = document.getElementById("controls-box");
            const videoElement = document.getElementById("recordedVideo");
            
            const addTextBtn = document.getElementById("add-text-btn");
            const inputContainer = document.getElementById("input-container");
            const userTextInput = document.getElementById("user-text");
            const confirmTextBtn = document.getElementById("confirm-text-btn");
            const videoOverlayText = document.getElementById("video-overlay-text");

            if (currentVideoBase64) {
                videoElement.src = currentVideoBase64;
                statusMsg.style.display = "none";
                videoBox.style.display = "block";
                controlsBox.style.display = "flex"; 
            } else {
                statusMsg.innerText = "لم يتم العثور على أي فيديو مسجل. يجب بدء تسجيل فيديو اولاً.";
                statusMsg.style.color = "#ff4444";
            }

            addTextBtn.addEventListener("click", () => {
                inputContainer.style.display = "flex";
                userTextInput.focus();
            });

            confirmTextBtn.addEventListener("click", () => {
                const textValue = userTextInput.value.trim();
                if (textValue !== "") {
                    videoOverlayText.innerText = textValue;
                    videoOverlayText.style.display = "block";
                    videoOverlayText.style.top = "50%";
                    videoOverlayText.style.left = "50%";
                    videoOverlayText.style.transform = "translate(-50%, -50%)";
                    inputContainer.style.display = "none"; 
                } else {
                    videoOverlayText.style.display = "none";
                }
            });

            userTextInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") confirmTextBtn.click();
            });

            // سحب وتحريك النص
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            function startDrag(e) {
                const pageX = e.pageX || e.touches[0].pageX;
                const pageY = e.pageY || e.touches[0].pageY;
                isDragging = true;
                startX = pageX;
                startY = pageY;

                const rect = videoOverlayText.getBoundingClientRect();
                const containerRect = videoBox.getBoundingClientRect();
                initialLeft = rect.left - containerRect.left;
                initialTop = rect.top - containerRect.top;

                videoOverlayText.style.transform = "none";
                videoOverlayText.style.left = initialLeft + "px";
                videoOverlayText.style.top = initialTop + "px";
            }

            function doDrag(e) {
                if (!isDragging) return;
                e.preventDefault();
                const pageX = e.pageX || e.touches[0].pageX;
                const pageY = e.pageY || e.touches[0].pageY;
                let newLeft = initialLeft + (pageX - startX);
                let newTop = initialTop + (pageY - startY);

                const containerRect = videoBox.getBoundingClientRect();
                const textRect = videoOverlayText.getBoundingClientRect();
                const maxLeft = containerRect.width - textRect.width;
                const maxTop = containerRect.height - textRect.height;

                if (newLeft < 0) newLeft = 0;
                if (newLeft > maxLeft) newLeft = maxLeft;
                if (newTop < 0) newTop = 0;
                if (newTop > maxTop) newTop = maxTop;

                videoOverlayText.style.left = newLeft + "px";
                videoOverlayText.style.top = newTop + "px";
            }

            function stopDrag() { isDragging = false; }

            videoOverlayText.addEventListener("mousedown", startDrag);
            document.addEventListener("mousemove", doDrag);
            document.addEventListener("mouseup", stopDrag);
            videoOverlayText.addEventListener("touchstart", startDrag, { passive: false });
            document.addEventListener("touchmove", doDrag, { passive: false });
            document.addEventListener("touchend", stopDrag);
        });

        // **دالة التمكين والانتقال لـ YYYY**
        function enableAndProceedToYYYY() {
            if (currentVideoBase64) {
                // تفعيل وحفظ الفيديو لكي يتم سحبه في YYYY.html
                sessionStorage.setItem("capturedVideo", currentVideoBase64);
                window.location.href = "YYYY.html";
            } else {
                alert("لا يوجد فيديو للمتابعة!");
            }
        }
    </script>
</body>
</html>
