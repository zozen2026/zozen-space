<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل فيديو قصير</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* شاشة عرض الكاميرا بملء الشاشة */
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* زر الرجوع (أعلى اليمين) */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ff3b30;
            border: none;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .back-btn:active { transform: scale(0.9); }

        .back-arrow {
            width: 12px;
            height: 12px;
            border-top: 3px solid #fff;
            border-right: 3px solid #fff;
            transform: rotate(45deg);
            margin-right: -3px;
        }

        /* حاوية أزرار التحكم أسفل الصفحة */
        .controls-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        /* الدائرة الرئيسية للتسجيل */
        .main-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* شكل الدائرة أثناء التسجيل (شفافة بحواف بيضاء) */
        .main-btn.recording {
            background-color: transparent;
        }

        /* زر الإيقاف المؤقت الصغير */
        .pause-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            cursor: pointer;
            display: none; 
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* أيقونة الخطين الطوليين */
        .icon-pause {
            display: flex;
            gap: 4px;
        }
        .icon-pause span {
            width: 4px;
            height: 16px;
            background-color: #000;
        }

        /* أيقونة المثلث */
        .icon-play {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid #000;
            margin-left: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <button class="back-btn" onclick="goBack()" title="رجوع">
        <div class="back-arrow"></div>
    </button>

    <video id="preview" autoplay playsinline muted></video>

    <div class="controls-container">
        <button id="mainBtn" class="main-btn" onclick="handleMainButtonClick()"></button>
        
        <button id="pauseBtn" class="pause-btn" onclick="togglePause()">
            <div id="pauseIcon" class="icon-pause">
                <span></span>
                <span></span>
            </div>
            <div id="playIcon" class="icon-play"></div>
        </button>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let isPaused = false;
        let stream;

        const preview = document.getElementById('preview');
        const mainBtn = document.getElementById('mainBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const playIcon = document.getElementById('playIcon');

        function goBack() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            window.history.back();
        }

        async function setupCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = stream;
            } catch (err) {
                alert("يرجى السماح بالوصول إلى الكاميرا والميكروفون.");
                console.error(err);
            }
        }
        setupCamera();

        function handleMainButtonClick() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecordingAndNavigate();
            }
        }

        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.start(10); 
            isRecording = true;
            mainBtn.classList.add('recording');
            pauseBtn.style.display = 'flex';
        }

        function togglePause() {
            if (!isPaused) {
                mediaRecorder.pause();
                isPaused = true;
                pauseIcon.style.display = 'none';
                playIcon.style.display = 'block';
            } else {
                mediaRecorder.resume();
                isPaused = false;
                pauseIcon.style.display = 'flex';
                playIcon.style.display = 'none';
                mainBtn.classList.add('recording');
            }
        }

        function stopRecordingAndNavigate() {
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                
                // تحويل الفيديو إلى دفق بيانات وحفظه مؤقتاً بصيغة Base64 لضمان الانتقال الآمن للرابط
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    sessionStorage.setItem('recordedVideoData', reader.result);
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    window.location.href = 'vvv2.html';
                };
            };
            mediaRecorder.stop();
        }
    </script>
</body>
</html>
