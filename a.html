<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تصفح الفيديوهات القصيرة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* حاوية التصفح الرأسي (سحب / تقليب) */
        .reels-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* زر الرجوع (×) في الأعلى واليسار */
        .close-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* معلومات المستخدم والأزرار يمين الشاشة من الأسفل */
        .reel-footer {
            position: absolute;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            color: white;
            text-align: right;
        }

        .user-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .username {
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .follow-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: 0.2s;
            margin-bottom: 15px;
        }
        .follow-btn:hover {
            background-color: #e55c00;
        }

        /* أزرار التفاعل (القلب والتعليقات) */
        .action-btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            font-size: 26px;
        }
        .action-btn-group span {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }
        .action-btn-group:active {
            transform: scale(1.2);
        }

        /* نافذة التعليقات المنبثقة من الأسفل */
        .comments-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 60vh;
            background: #1e1e1e;
            color: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 3000;
            transition: bottom 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
        }
        .comments-drawer.active {
            bottom: 0;
        }

        .comments-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .comment-item {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .comment-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #555;
            object-fit: cover;
        }
        .comment-content .c-user {
            font-weight: bold;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 3px;
        }
        .comment-content .c-text {
            font-size: 14px;
        }

        /* شريط إدخال التعليق (المعطل) */
        .comments-input-area {
            padding: 15px;
            background: #121212;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }
        .comments-input-area input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #2a2a2a;
            color: white;
            outline: none;
        }

        /* نافذة التنبيه المنبثقة (Modal) للتسجيل */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .modal-box {
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .modal-close-icon {
            position: absolute;
            top: 10px;
            left: 15px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #777;
        }

        .modal-box p {
            font-size: 15px;
            margin: 20px 0;
            font-weight: bold;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body onload="loadReels()">

    <!-- زر الإغلاق فوق يسار -->
    <button class="close-btn" onclick="history.back()"><i class="fas fa-times"></i></button>

    <!-- حاوية الفيديوهات القصيرة -->
    <div class="reels-container" id="reelsContainer"></div>

    <!-- نافذة التعليقات الجانبية -->
    <div class="comments-drawer" id="commentsDrawer">
        <div class="comments-header">
            <span>التعليقات</span>
            <i class="fas fa-times" style="cursor: pointer;" onclick="closeComments()"></i>
        </div>
        <div class="comments-list" id="commentsList">
            <div class="comment-item">
                <img src="https://via.placeholder.com/35" class="comment-avatar">
                <div class="comment-content">
                    <div class="c-user">أحمد محمد</div>
                    <div class="c-text">فيديو رائع جداً، استمر! 🔥</div>
                </div>
            </div>
            <div class="comment-item">
                <img src="https://via.placeholder.com/35" class="comment-avatar">
                <div class="comment-content">
                    <div class="c-user">سارة علي</div>
                    <div class="c-text">جميل جداً أعجبني.</div>
                </div>
            </div>
        </div>
        <div class="comments-input-area">
            <input type="text" placeholder="اكتب تعليقاً..." onclick="showAuthModalForComment()" onfocus="showAuthModalForComment()" readonly>
        </div>
    </div>

    <!-- النافذة المنبثقة للتنبيه بتسجيل الدخول -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <button class="modal-close-icon" onclick="closeAuthModal()"><i class="fas fa-times"></i></button>
            <p id="modalMessage">يجب تنشئ حساب لكي تتمكن من الإعجاب.</p>
            <button class="modal-btn" onclick="goToAuth()">حسناً لننشئ حساباً جديداً او اسجل دخول</button>
        </div>
    </div>

    <script>
        function loadReels() {
            const container = document.getElementById('reelsContainer');
            // سحب الفيديوهات من التخزين المحلي (يدعم publishedVideos أو app_videos)
            const posts = JSON.parse(localStorage.getItem('publishedVideos')) || JSON.parse(localStorage.getItem('app_videos')) || [];

            if (posts.length === 0) {
                container.innerHTML = '<div style="color:white; display:flex; justify-content:center; align-items:center; height:100vh;">لا توجد فيديوهات منشورة حالياً.</div>';
                return;
            }

            container.innerHTML = posts.map(p => `
                <div class="reel-card">
                    <video class="reel-video" src="${p.url}" loop muted playsinline></video>
                    
                    <div class="reel-footer">
                        <div class="user-info-group">
                            <span class="username">${p.title || p.userName || 'مستخدم'}</span>
                            <img src="${p.avatar || 'https://via.placeholder.com/50'}" class="user-avatar" alt="صورة المستخدم">
                        </div>
                        
                        <button class="follow-btn" onclick="showAuthModalForLike()">متابعة</button>
                        
                        <!-- زر القلب (الإعجاب) -->
                        <button class="action-btn-group" onclick="showAuthModalForLike()">
                            <i class="fas fa-heart"></i>
                            <span>أعجبني</span>
                        </button>

                        <!-- زر التعليقات -->
                        <button class="action-btn-group" onclick="openComments()">
                            <i class="fas fa-comment-dots"></i>
                            <span>تعليقات</span>
                        </button>
                    </div>
                </div>
            `).join('');

            setupVideoObserver();
        }

        function showAuthModalForLike() {
            document.getElementById('modalMessage').innerText = "يجب تنشئ حساب لكي تتمكن من الإعجاب.";
            document.getElementById('authModal').style.display = 'flex';
        }

        function showAuthModalForComment() {
            document.getElementById('modalMessage').innerText = "يجب تنشئ حساب لكي تتمكن من كتابة تعليقات.";
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function openComments() {
            document.getElementById('commentsDrawer').classList.add('active');
        }

        function closeComments() {
            document.getElementById('commentsDrawer').classList.remove('active');
        }

        function goToAuth() {
            window.location.href = 'profile.html'; 
        }

        function setupVideoObserver() {
            const videos = document.querySelectorAll('.reel-video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play();
                    } else {
                        entry.target.pause();
                        entry.target.currentTime = 0; // إعادة الفيديو للبداية عند التمرير عنه
                    }
                });
            }, { threshold: 0.6 });

            videos.forEach(video => observer.observe(video));
        }
    </script>
</body>
</html>
